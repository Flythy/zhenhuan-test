<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如果穿越进甄嬛传，你会是谁？</title>
<style>
:root {
  --crimson: #8B1A2B;
  --crimson-dark: #5C0E1A;
  --crimson-deep: #3D0810;
  --gold: #C9A96E;
  --gold-light: #E8D5A3;
  --gold-dark: #8B723A;
  --ink: #1A1A1A;
  --ink-light: #2D2D2D;
  --cream: #F5F0E8;
  --cream-dark: #E0D5C0;
  --jade: #2E6B4F;
  --jade-light: #4A8C6A;
  --rose: #D4848A;
  --white: #FAF7F2;
  --radius: 8px;
  --radius-lg: 16px;
  --font-display: 'STKaiti', 'KaiTi', '楷体', serif;
  --font-body: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Hiragino Sans GB', 'SimSun', '宋体', sans-serif;
  --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.7;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.page {
  display: none;
  min-height: 100vh;
  padding: 40px 24px;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.page.active {
  display: flex;
  opacity: 1;
  transform: translateY(0);
}

.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  animation: fall linear infinite;
  opacity: 0.3;
}
@keyframes fall {
  0% { transform: translateY(-10%) rotate(0deg); opacity: 0.8; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

.bg-pattern {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.03;
  background-image:
    radial-gradient(circle at 20% 30%, var(--gold) 1px, transparent 1px),
    radial-gradient(circle at 80% 70%, var(--gold) 1px, transparent 1px),
    radial-gradient(circle at 50% 10%, var(--gold) 1px, transparent 1px);
  background-size: 80px 80px, 100px 100px, 60px 60px;
}

.decorative-border {
  border: 1px solid rgba(201, 169, 110, 0.3);
  border-radius: var(--radius-lg);
  position: relative;
}
.decorative-border::before {
  content: '';
  position: absolute;
  top: 6px; left: 6px; right: 6px; bottom: 6px;
  border: 1px solid rgba(201, 169, 110, 0.15);
  border-radius: calc(var(--radius-lg) - 4px);
  pointer-events: none;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 48px;
  background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
  color: var(--gold-light);
  border: 2px solid var(--gold);
  border-radius: 50px;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  text-decoration: none;
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
  opacity: 0;
  transition: opacity var(--transition);
}
.btn-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 32px rgba(139, 26, 43, 0.5), 0 0 0 6px rgba(201, 169, 110, 0.15);
  border-color: var(--gold-light);
}
.btn-primary:hover::before { opacity: 1; }
.btn-primary:active { transform: scale(0.98); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  background: transparent;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  border-radius: 50px;
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
}
.btn-secondary:hover {
  background: rgba(201, 169, 110, 0.1);
  border-color: var(--gold-light);
  color: var(--gold-light);
  transform: translateY(-1px);
}

.seal-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px; height: 64px;
  border: 2px solid var(--gold);
  border-radius: 6px;
  font-family: var(--font-display);
  font-size: 0.8rem;
  color: var(--gold);
  transform: rotate(-3deg);
  background: rgba(139, 26, 43, 0.2);
  writing-mode: vertical-lr;
  letter-spacing: 0.2em;
}

.gold-divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px auto;
}

.fade-in {
  animation: fadeIn 0.8s ease forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.delay-1 { animation-delay: 0.15s; }
.delay-2 { animation-delay: 0.3s; }
.delay-3 { animation-delay: 0.45s; }
.delay-4 { animation-delay: 0.6s; }

/* ===== HOME PAGE ===== */
.home-hero {
  position: relative;
  z-index: 1;
  text-align: center;
  padding-top: 60px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-seal {
  width: 80px; height: 80px;
  border: 2px solid var(--gold);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 32px;
  transform: rotate(-5deg);
  background: rgba(139, 26, 43, 0.25);
  animation: sealPulse 3s ease-in-out infinite;
}
@keyframes sealPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(201, 169, 110, 0.2); }
  50% { box-shadow: 0 0 40px rgba(201, 169, 110, 0.4); }
}
.home-seal span {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--gold);
  writing-mode: vertical-lr;
  letter-spacing: 0.3em;
}

.home-title {
  font-family: var(--font-display);
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--gold-light);
  line-height: 1.3;
  margin-bottom: 12px;
  text-shadow: 0 2px 24px rgba(139, 26, 43, 0.6);
}
.home-subtitle {
  font-size: 1rem;
  color: var(--cream-dark);
  margin-bottom: 48px;
  letter-spacing: 0.15em;
  font-weight: 300;
}

.home-chars {
  display: flex;
  gap: 12px;
  margin-bottom: 48px;
  flex-wrap: wrap;
  justify-content: center;
}
.home-char-chip {
  padding: 8px 20px;
  border: 1px solid rgba(201, 169, 110, 0.3);
  border-radius: 50px;
  font-size: 0.85rem;
  color: var(--cream-dark);
  background: rgba(255,255,255,0.03);
  transition: all var(--transition);
  cursor: default;
}
.home-char-chip:hover {
  border-color: var(--gold);
  color: var(--gold-light);
  background: rgba(201, 169, 110, 0.08);
}

/* ===== QUIZ PAGE ===== */
.quiz-container {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

.progress-wrap {
  width: 100%;
  margin-bottom: 48px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 0.8rem;
  color: var(--cream-dark);
  letter-spacing: 0.1em;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--crimson), var(--gold));
  border-radius: 2px;
  transition: width 0.5s ease;
}

.question-text {
  font-family: var(--font-display);
  font-size: 1.55rem;
  color: var(--gold-light);
  text-align: center;
  margin-bottom: 36px;
  line-height: 1.6;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
}

.option-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  background: rgba(255,255,255,0.03);
  border: 1.5px solid rgba(201, 169, 110, 0.2);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.option-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(201, 169, 110, 0.06));
  opacity: 0;
  transition: opacity var(--transition);
}
.option-card:hover {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.06);
  transform: translateX(4px);
}
.option-card:hover::after { opacity: 1; }
.option-card:active { transform: scale(0.985); }

.option-letter {
  flex-shrink: 0;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  font-family: var(--font-display);
  font-size: 0.9rem;
  color: var(--gold);
  background: rgba(201, 169, 110, 0.08);
  transition: all var(--transition);
}
.option-card:hover .option-letter {
  background: rgba(201, 169, 110, 0.2);
  color: var(--gold-light);
  box-shadow: 0 0 12px rgba(201, 169, 110, 0.2);
}

.option-text {
  font-size: 1rem;
  color: var(--cream);
  line-height: 1.5;
  transition: color var(--transition);
}
.option-card:hover .option-text {
  color: var(--white);
}

.quiz-dot-indicator {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 32px;
}
.quiz-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(201, 169, 110, 0.2);
  transition: all var(--transition);
}
.quiz-dot.done { background: var(--gold); }
.quiz-dot.current {
  background: var(--gold-light);
  box-shadow: 0 0 12px rgba(201, 169, 110, 0.5);
  transform: scale(1.3);
}

/* ===== RESULT PAGE ===== */
.result-container {
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.result-badge {
  font-size: 0.85rem;
  color: var(--gold);
  letter-spacing: 0.2em;
  margin-bottom: 20px;
  opacity: 0.7;
}

.result-character-emoji {
  font-size: 5rem;
  margin-bottom: 20px;
  filter: drop-shadow(0 4px 20px rgba(201, 169, 110, 0.3));
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.result-name {
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 900;
  color: var(--gold-light);
  margin-bottom: 4px;
  line-height: 1.2;
}
.result-title {
  font-size: 1rem;
  color: var(--cream-dark);
  letter-spacing: 0.2em;
  margin-bottom: 24px;
}

.result-quote-block {
  background: rgba(139, 26, 43, 0.15);
  border-left: 3px solid var(--gold);
  padding: 16px 24px;
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 32px;
  width: 100%;
  text-align: left;
}
.result-quote-text {
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--gold-light);
  font-style: italic;
  line-height: 1.6;
}

.result-section-title {
  font-size: 0.8rem;
  color: var(--gold);
  letter-spacing: 0.25em;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.trait-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
}
.trait-tag {
  padding: 8px 20px;
  border: 1px solid rgba(201, 169, 110, 0.4);
  border-radius: 50px;
  font-size: 0.9rem;
  color: var(--gold-light);
  background: rgba(201, 169, 110, 0.06);
  letter-spacing: 0.05em;
}

.result-match-reason {
  font-size: 0.95rem;
  color: var(--cream-dark);
  line-height: 1.8;
  margin-bottom: 24px;
  max-width: 420px;
}

.result-description {
  font-size: 0.9rem;
  color: rgba(224, 213, 192, 0.7);
  line-height: 1.8;
  margin-bottom: 36px;
  max-width: 420px;
}

.result-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== GALLERY PAGE ===== */
.gallery-container {
  z-index: 1;
  width: 100%;
}
.gallery-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--gold-light);
  text-align: center;
  margin-bottom: 8px;
}
.gallery-subtitle {
  font-size: 0.85rem;
  color: var(--cream-dark);
  text-align: center;
  margin-bottom: 36px;
  letter-spacing: 0.1em;
}

.gallery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 40px;
}

.char-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(201, 169, 110, 0.2);
  border-radius: var(--radius-lg);
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.char-card:hover {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.06);
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.char-card-emoji {
  font-size: 2.5rem;
  margin-bottom: 10px;
}
.char-card-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--gold-light);
  margin-bottom: 4px;
}
.char-card-title {
  font-size: 0.75rem;
  color: var(--cream-dark);
  letter-spacing: 0.1em;
}

@media (max-width: 640px) {
  .home-title { font-size: 2rem; }
  .question-text { font-size: 1.25rem; }
  .result-name { font-size: 2.2rem; }
  .gallery-grid { grid-template-columns: 1fr; }
  .btn-primary { padding: 14px 36px; font-size: 1.1rem; }
  .option-card { padding: 14px 16px; }
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--cream-dark);
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--font-body);
  transition: color var(--transition);
  margin-bottom: 32px;
}
.back-link:hover { color: var(--gold-light); }
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="particles" id="particles"></div>

<div id="app">
  <!-- Home Page -->
  <div class="page active" id="page-home">
    <div class="home-hero">
      <div class="home-seal fade-in"><span>甄嬛传</span></div>
      <h1 class="home-title fade-in delay-1">如果穿越进甄嬛传<br>你会是谁？</h1>
      <p class="home-subtitle fade-in delay-2">十道题 · 测测你的宫廷人格</p>
      <div class="home-chars fade-in delay-3">
        <span class="home-char-chip">甄嬛</span>

        <span>开始测试</span>
        <span style="font-size:1.3rem;">→</span>
      </button>
    </div>
  </div>

  <!-- Gallery Page -->
  <div class="page" id="page-gallery">
    <div class="gallery-container">
      <button class="back-link" onclick="navigateTo('home')">← 返回首页</button>
      <h2 class="gallery-title fade-in">人物图鉴</h2>
      <p class="gallery-subtitle fade-in delay-1">八位经典人物，看看你最像谁</p>
      <div class="gallery-grid" id="gallery-grid"></div>
      <div style="text-align:center;">
        <button class="btn-primary" onclick="startQuiz()">开始测试</button>
      </div>
    </div>
  </div>

  <!-- Result Page -->
  <div class="page" id="page-result">
    <div class="result-container" id="result-content"></div>
  </div>

  <!-- Quiz Page -->
  <div class="page" id="page-quiz">
    <div class="quiz-container">
      <button class="back-link" onclick="navigateTo('home')">← 返回首页</button>
      <div class="quiz-dot-indicator" id="quiz-dots"></div>
      <div class="question-text" id="question-text"></div>
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="progress-label">第 1/10 题</span>
          <span id="progress-pct">10%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width: 10%;"></div>
        </div>
      </div>
      <div class="options-list" id="options-list"></div>
    </div>
  </div>
</div>

let quizState = {
  currentIndex: 0,
  answers: {},
  scores: {}
};

function initScores() {
  const s = {};
  characters.forEach(c => s[c.id] = 0);
  return s;
}

// ===== NAVIGATION =====
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== PARTICLES =====
function createParticles() {
  const container = document.getElementById('particles');
  const shapes = ['🌸', '🍂', '✦', '❀', '✿', '♢'];
  for (let i = 0; i < 25; i++) {
    const particle = document.createElement('span');
    particle.className = 'particle';
    particle.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    particle.style.left = Math.random() * 100 + '%';
    particle.style.fontSize = (8 + Math.random() * 18) + 'px';
    particle.style.animationDuration = (8 + Math.random() * 14) + 's';
    particle.style.animationDelay = Math.random() * 12 + 's';
    container.appendChild(particle);
  }
}

// ===== QUIZ =====
function startQuiz() {
  quizState = { currentIndex: 0, answers: {}, scores: initScores() };
  navigateTo('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[quizState.currentIndex];
  const total = questions.length;
  const progress = ((quizState.currentIndex + 1) / total) * 100;

  document.getElementById('question-text').textContent = q.question;
  document.getElementById('question-text').style.opacity = '0';
  document.getElementById('question-text').style.transform = 'translateY(10px)';
  requestAnimationFrame(() => {
    document.getElementById('question-text').style.opacity = '1';
    document.getElementById('question-text').style.transform = 'translateY(0)';
  });

  document.getElementById('progress-label').textContent = `第 ${quizState.currentIndex + 1}/${total} 题`;
  document.getElementById('progress-pct').textContent = Math.round(progress) + '%';
  document.getElementById('progress-fill').style.width = progress + '%';

  const dotsContainer = document.getElementById('quiz-dots');
  dotsContainer.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('span');
    dot.className = 'quiz-dot';
    if (quizState.answers[i + 1] !== undefined) dot.classList.add('done');
    if (i === quizState.currentIndex) dot.classList.add('current');
    dotsContainer.appendChild(dot);
  }

  const optionsList = document.getElementById('options-list');
  optionsList.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.style.animationDelay = (idx * 0.08) + 's';
    card.classList.add('fade-in');

    const letter = document.createElement('span');
    letter.className = 'option-letter';
    letter.textContent = letters[idx];

    const text = document.createElement('span');
    text.className = 'option-text';
    text.textContent = opt.text;

    card.appendChild(letter);
    card.appendChild(text);

    card.addEventListener('click', () => selectOption(q.id, opt));
    optionsList.appendChild(card);
  });
}

function selectOption(questionId, option) {
  quizState.answers[questionId] = option.id;
  collectScore(option.scores);

  if (quizState.currentIndex < questions.length - 1) {
    const questionText = document.getElementById('question-text');
    const optionsList = document.getElementById('options-list');
    questionText.style.opacity = '0';
    questionText.style.transform = 'translateY(-10px)';
    Array.from(optionsList.children).forEach((card, i) => {
      card.style.opacity = '0';
      card.style.transform = 'translateX(-20px)';
      card.style.transition = 'all 0.3s ease ' + (i * 0.05) + 's';
    });

    setTimeout(() => {
      quizState.currentIndex++;
      renderQuestion();
    }, 400);
  } else {
    finishQuiz();
  }
}

function collectScore(scores) {
  for (const [charId, pts] of Object.entries(scores)) {
    quizState.scores[charId] = (quizState.scores[charId] || 0) + (pts || 0);
  }
}

function finishQuiz() {
  let maxChar = characters[0].id;
  let maxScore = 0;
  for (const [charId, score] of Object.entries(quizState.scores)) {
    if (score > maxScore) { maxScore = score; maxChar = charId; }
  }
  quizState.result = maxChar;
  navigateTo('result');
  renderResult(maxChar);
}

function renderResult(charId) {
  const c = characters.find(ch => ch.id === charId);
  const container = document.getElementById('result-content');

  container.innerHTML = `
    <div class="fade-in" style="margin-bottom:8px;font-size:0.8rem;color:var(--gold);letter-spacing:0.2em;opacity:0.7;">你的宫廷人格是</div>
    <div class="result-character-emoji fade-in delay-1">${c.emoji}</div>
    <div class="result-name fade-in delay-2" style="color:${c.color === '#8B1A2B' ? 'var(--gold-light)' : c.color === '#C4283B' ? '#F07080' : c.color === '#4A1A5E' ? '#C9A0DC' : c.color === '#6B4E71' ? '#D4C0DC' : c.color === '#2D5A3F' ? '#5DAF78' : c.color === '#1A4A6B' ? '#5AADDD' : c.color === '#8B5E3C' ? '#D4A878' : '#8A8AAA'}">${c.name}</div>
    <div class="result-title fade-in delay-2">${c.title}</div>
    <div class="gold-divider fade-in delay-3"></div>
    <div class="result-quote-block fade-in delay-3">
      <div class="result-quote-text">${c.quote}</div>
    </div>
    <div class="result-section-title fade-in delay-4">性格特质</div>
    <div class="trait-tags fade-in delay-4">
      ${c.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
    </div>
    <div class="gold-divider fade-in delay-4"></div>
    <div class="result-section-title fade-in delay-4">为什么是你？</div>
    <div class="result-match-reason fade-in delay-4">${c.matchReason}</div>
    <div class="result-description fade-in delay-4">${c.description}</div>
    <div class="result-actions fade-in delay-4">
      <button class="btn-secondary" onclick="startQuiz()">重新测试</button>
      <button class="btn-primary" style="padding:14px 32px;font-size:1rem;" onclick="shareResult('${c.name}')">
        <span>📋 分享结果</span>
      </button>
    </div>
  `;
}

function shareResult(charName) {
  const text = `我在《甄嬛传》穿越测试中测出了「${charName}」！来测测你会是谁→`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btns = document.querySelectorAll('.btn-primary');
      const shareBtn = btns[btns.length - 1];
      if (shareBtn) {
        const orig = shareBtn.innerHTML;
        shareBtn.innerHTML = '<span>✓ 已复制！</span>';
        setTimeout(() => { shareBtn.innerHTML = orig; }, 2000);
      }
    });
  }
}

// ===== GALLERY =====
function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';
  characters.forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card fade-in';
    card.innerHTML = `
      <div class="char-card-emoji">${c.emoji}</div>
      <div class="char-card-name">${c.name}</div>
      <div class="char-card-title">${c.title}</div>
    `;
    card.addEventListener('click', () => {
      navigateTo('result');
      renderResult(c.id);
    });
    grid.appendChild(card);
  });
}

// Init
createParticles();
renderGallery();

document.querySelectorAll('.back-link').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const target = this.getAttribute('onclick');
    if (target && target.includes("'home'")) navigateTo('home');
  });
});
