<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTest - 趣味测试工具箱</title>
<style>
:root {
  --crimson: #8B1A2B;
  --crimson-dark: #5C0E1A;
  --gold: #C9A96E;
  --gold-light: #E8D5A3;
  --ink: #1A1A1A;
  --cream: #F5F0E8;
  --cream-dark: #E0D5C0;
  --jade: #2E6B4F;
  --font-display: 'STKaiti', 'KaiTi', '楷体', serif;
  --font-body: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
  --radius-lg: 16px;
  --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  line-height: 1.7;
}
.bg-pattern {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.03;
  background-image:
    radial-gradient(circle at 20% 30%, var(--gold) 1px, transparent 1px),
    radial-gradient(circle at 80% 70%, var(--gold) 1px, transparent 1px);
  background-size: 80px 80px, 100px 100px;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 24px;
  position: relative;
  z-index: 1;
}
.header {
  text-align: center;
  margin-bottom: 48px;
}
.logo {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--gold-light);
  letter-spacing: 0.12em;
  margin-bottom: 8px;
  position: relative;
}
.logo-dot {
  color: var(--crimson);
  font-size: 2.2rem;
}
.subtitle {
  font-size: 0.85rem;
  color: var(--cream-dark);
  letter-spacing: 0.15em;
}
.test-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.test-card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 22px 24px;
  background: rgba(255,255,255,0.03);
  border: 1.5px solid rgba(201, 169, 110, 0.2);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  color: inherit;
}
.test-card:hover {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.06);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.test-card-emoji {
  font-size: 2.4rem;
  flex-shrink: 0;
  width: 56px;
  text-align: center;
  transition: transform var(--transition);
}
.test-card:hover .test-card-emoji {
  transform: scale(1.15);
}
.test-card-info {
  flex: 1;
  min-width: 0;
}
.test-card-title {
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: var(--gold-light);
  margin-bottom: 4px;
}
.test-card-desc {
  font-size: 0.8rem;
  color: var(--cream-dark);
  letter-spacing: 0.05em;
}
.test-card-badge {
  flex-shrink: 0;
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}
.badge-hot {
  background: rgba(139, 26, 43, 0.3);
  color: #E07080;
  border: 1px solid rgba(139, 26, 43, 0.4);
}
.badge-new {
  background: rgba(46, 107, 79, 0.3);
  color: #5DAF78;
  border: 1px solid rgba(46, 107, 79, 0.4);
}
.badge-soon {
  background: rgba(255,255,255,0.05);
  color: rgba(224, 213, 192, 0.5);
  border: 1px solid rgba(255,255,255,0.08);
}
.test-card-arrow {
  font-size: 1.1rem;
  color: var(--gold);
  opacity: 0;
  transition: all var(--transition);
  flex-shrink: 0;
}
.test-card:hover .test-card-arrow {
  opacity: 1;
  transform: translateX(4px);
}

.coming-soon {
  opacity: 0.5;
  pointer-events: none;
}
.coming-soon .test-card-title {
  color: rgba(232, 213, 163, 0.5);
}

.fade-in { animation: fadeIn 0.8s ease forwards; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }

.footer {
  text-align: center;
  margin-top: 56px;
  font-size: 0.75rem;
  color: rgba(224, 213, 192, 0.3);
  letter-spacing: 0.1em;
}

@media (max-width: 640px) {
  #app { padding: 32px 16px; }
  .logo { font-size: 1.4rem; }
  .test-card { padding: 16px 18px; gap: 14px; }
  .test-card-emoji { font-size: 2rem; width: 44px; }
  .test-card-title { font-size: 1rem; }
}

.particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.particle {
  position: absolute;
  animation: fall linear infinite;
  opacity: 0.25;
}
@keyframes fall {
  0% { transform: translateY(-10%) rotate(0deg); opacity: 0.6; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="particles" id="particles"></div>

<div id="app">
  <div class="header fade-in">
    <div class="logo">Mini<span class="logo-dot">·</span>Test</div>
    <div class="subtitle">趣味测试工具箱</div>
  </div>

  <div class="test-list">
    <a class="test-card fade-in delay-1" href="zhenhuan/">
      <div class="test-card-emoji">👑</div>
      <div class="test-card-info">
        <div class="test-card-title">如果穿越进甄嬛传，你会是谁？</div>
        <div class="test-card-desc">十道题 · 测测你的宫廷人格</div>
      </div>
      <span class="test-card-badge badge-hot">🔥 热门</span>
      <span class="test-card-arrow">→</span>
    </a>

    <a class="test-card fade-in delay-2" href="pet/">
      <div class="test-card-emoji">🐾</div>
      <div class="test-card-info">
        <div class="test-card-title">找到最适合你的宠物</div>
        <div class="test-card-desc">性格匹配 · 科学养宠指南</div>
      </div>
      <span class="test-card-badge badge-new">🆕 即将上线</span>
      <span class="test-card-arrow">→</span>
    </a>

    <div class="test-card coming-soon fade-in delay-3">
      <div class="test-card-emoji">🧠</div>
      <div class="test-card-info">
        <div class="test-card-title">你的隐藏人格是什么？</div>
        <div class="test-card-desc">MBTI 进阶版 · 九型人格探索</div>
      </div>
      <span class="test-card-badge badge-soon">⏳ 开发中</span>
    </div>

    <div class="test-card coming-soon fade-in delay-4">
      <div class="test-card-emoji">💤</div>
      <div class="test-card-info">
        <div class="test-card-title">睡眠质量深度检测</div>
        <div class="test-card-desc">科学评估 · 个性化改善方案</div>
      </div>
      <span class="test-card-badge badge-soon">⏳ 开发中</span>
    </div>

    <a class="test-card fade-in delay-5" href="bailan/">
      <div class="test-card-emoji">🦥</div>
      <div class="test-card-info">
        <div class="test-card-title">SLTI 摆烂人格测试</div>
        <div class="test-card-desc">打工人专属 · 找到你的摆烂人格代码</div>
      </div>
      <span class="test-card-badge badge-hot">🔥 新上线</span>
      <span class="test-card-arrow">→</span>
    </a>
  </div>

  <div class="footer">minitext.top</div>
</div>

<script>
(function() {
  var c = document.getElementById('particles');
  var s = ['🌸', '🍂', '✦', '❀', '✿', '♢'];
  for (var i = 0; i < 20; i++) {
    var p = document.createElement('span');
    p.className = 'particle';
    p.textContent = s[Math.floor(Math.random() * s.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (7 + Math.random() * 14) + 'px';
    p.style.animationDuration = (10 + Math.random() * 14) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    c.appendChild(p);
  }
})();
</script>
</body>
</html>
